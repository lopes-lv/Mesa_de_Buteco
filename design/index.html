<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galeria de estilos — poker_game</title>
<style>
body{margin:0;font:16px system-ui,sans-serif;background:#111;color:#eee;padding:32px}
h1{margin:0 0 4px}p.s{margin:0 0 28px;opacity:.7}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
a{color:inherit;text-decoration:none;background:#1c1c1c;border:1px solid #333;border-radius:12px;padding:16px;display:block}
a:hover{border-color:#fff}b{display:block;font-size:18px}small{opacity:.65;display:block;margin-top:6px}
.l{margin-top:10px;font-size:13px}.l span{margin-right:10px;text-decoration:underline}
</style></head><body>
<h1>Galeria de estilos</h1><p class="s">Cada mockup tem 13 telas (menus, configuração, multiplayer, mesas de Hold'em, Pif Paf e Dominó, fim de jogo) — use as abas no topo. Fontes vêm do Google Fonts (precisa de internet).</p>
<div class="g" id="g"></div>
<script>
const L=[
["06_art_deco_cassino","Art Déco Cassino","Dourado, simetria, molduras geométricas"],
["07_pixel_retro_crt","Pixel Art Retrô CRT","Paleta limitada, sombras duras, 8-bit"],
["09_papel_vintage","Papel Ilustrado Vintage","Papel envelhecido, serifas, tinta"],
["11_zen_japones","Zen Japonês","Hanafuda, círculo vermelho, espaço vazio"]];
document.getElementById("g").innerHTML=L.map(x=>`<a href="${x[0]}/mockup.html"><b>${x[1]}</b><small>${x[2]}</small></a>`).join("");
</script></body></html>
