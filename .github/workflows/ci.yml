name: CI

on:
  push:
    branches: [main, master, develop, "feat/**"]
  pull_request:
  schedule:
    - cron: "0 6 * * *"     # toda manhã: roda também a suíte completa
  workflow_dispatch:

# Pygame sem janela e sem som: os testes rodam em qualquer servidor.
env:
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
  PYTHONUTF8: "1"

jobs:
  rapido:
    name: Regras e estrutura (rápido)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt ruff
      # Só erros de verdade (nome indefinido, sintaxe), sem regras de estilo.
      - run: ruff check . --select E9,F63,F7,F82 --exclude design,build,dist
      - run: pytest -m "not lento" --timeout=60 -q -rx

  completo:
    name: Simulações e matriz do editor (lento)
    # Em PR, no cron e no disparo manual; em push comum só o job rápido.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -m lento --timeout=600 -q -rx

  windows:
    name: Testes no Windows (rápido)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest -m "not lento" --timeout=60 -q

  exe:
    name: Build do .exe (só manual)
    if: github.event_name == 'workflow_dispatch'
    needs: [rapido]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pygame pyinstaller
      - run: pyinstaller PixelPoker.spec
      - uses: actions/upload-artifact@v4
        with:
          name: PixelPoker
          path: dist/PixelPoker.exe
